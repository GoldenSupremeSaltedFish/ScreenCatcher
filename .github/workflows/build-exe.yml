name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pyinstaller
        pip install pillow pyzbar
        
    - name: Install Windows dependencies for pyzbar
      run: |
        # Install Visual C++ Redistributable (required for pyzbar)
        choco install vcredist2015 -y
        
    - name: Build executable with PyInstaller
      run: |
        # 确保在正确的目录中
        Get-Location
        Get-ChildItem
        # 检查文件是否存在
        if (Test-Path "ScreenCatcher.spec") {
          Write-Host "Using ScreenCatcher.spec"
          pyinstaller --clean ScreenCatcher.spec
        } elseif (Test-Path "ScreenCatcher-simple.spec") {
          Write-Host "Using ScreenCatcher-simple.spec"
          pyinstaller --clean ScreenCatcher-simple.spec
        } else {
          Write-Host "No .spec file found, using command line options"
          pyinstaller --onefile --windowed --name ScreenCatcher --clean src/screencatcher/ScreenCatcher.py
        }
        
    - name: Verify build output
      run: |
        Write-Host "Checking build output..."
        if (Test-Path "dist/ScreenCatcher.exe") {
          $fileSize = (Get-Item "dist/ScreenCatcher.exe").Length / 1MB
          Write-Host "✅ ScreenCatcher.exe found - Size: $([math]::Round($fileSize, 2)) MB"
          Get-ChildItem "dist/" -Name
        } else {
          Write-Host "❌ ScreenCatcher.exe not found!"
          Get-ChildItem "dist/" -ErrorAction SilentlyContinue
          exit 1
        }
        
    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScreenCatcher-Executable
        path: dist/ScreenCatcher.exe
        retention-days: 30
        if-no-files-found: error
        
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/ScreenCatcher.exe
        body: |
          ## ScreenCatcher Windows Executable
          
          ### Download:
          - **ScreenCatcher.exe**: Standalone executable (no installation required)
          
          ### Usage:
          1. Download `ScreenCatcher.exe`
          2. Run the executable
          3. Use `Alt+Q` to capture and recognize QR codes
          4. Press `Esc` to exit
          
          ### Features:
          - Screenshot and QR code recognition
          - Automatic browser opening for HTTP/HTTPS URLs
          - Clean GUI interface
          - Hotkey support (Alt+Q)
          
          ### System Requirements:
          - Windows 10/11
          - No additional dependencies required
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
